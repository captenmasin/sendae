name: Sendae
icon: public/icon.png
icon_initials: S
processes:
  Desktop HMR:
    command: composer native:dev
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
  Update:
    command: composer update && pnpm update
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Build macOS:
    command: composer desktop:build
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Build Windows:
    command: node scripts/prepare-desktop.mjs && php artisan native:build win x64 --no-interaction
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Fresh Install:
    command: php artisan optimize:clear && composer clear-cache && pnpm store prune && rm -rf vendor node_modules && composer install && pnpm install --frozen-lockfile && composer desktop:setup
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Pail:
    command: php artisan pail -vv
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}
  Tests:
    command: php artisan test && pnpm test
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
